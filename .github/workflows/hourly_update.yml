name: 每小時更新外匯網格策略報告

on:
  schedule:
    - cron: "0 * * * *"   # 每小時整點 (UTC)
  workflow_dispatch: {}    # 允許在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 還原上次抓到的報價快取（Yahoo Finance 偶爾限流時的備援）
        uses: actions/cache@v4
        with:
          path: data_fx_1h
          key: fx-data-${{ github.run_id }}
          restore-keys: |
            fx-data-

      - name: 抓取最新外匯報價並重新回測
        run: python scripts/generate_report.py

      - name: 提交並推送更新（僅在有變動時）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/data.json docs/fx_top8_performance.csv docs/fx_trade_log.csv
          if git diff --cached --quiet; then
            echo "沒有變動，略過提交"
          else
            git commit -m "自動更新：外匯網格策略報告 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
