<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bollinger 均值回歸 美股CFD策略 監控儀表板</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
:root {
    --bg-main: #0d1117;
    --bg-card: rgba(22, 27, 34, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(41, 182, 246, 0.4);
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --text-muted: #586069;
    --color-bull: #00e676;
    --color-bull-bg: rgba(0, 230, 118, 0.12);
    --color-bear: #ff1744;
    --color-bear-bg: rgba(255, 23, 68, 0.12);
    --color-accent: #29b6f6;
    --color-purple: #b388ff;
    --color-gold: #ffd54f;
    --font-heading: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.45);
    --backdrop-blur: blur(16px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-heading);
    min-height: 100vh;
    line-height: 1.5;
    background-image: radial-gradient(circle at 15% 15%, rgba(41,182,246,0.06) 0%, transparent 40%),
                       radial-gradient(circle at 85% 85%, rgba(179,136,255,0.06) 0%, transparent 40%);
    background-attachment: fixed;
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 22px; }
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    backdrop-filter: var(--backdrop-blur);
    box-shadow: var(--shadow-card);
    padding: 20px 24px;
}
.header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(90deg, #ffffff, #80d8ff, #b388ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-sub { color: var(--text-secondary); font-size: 12.5px; margin-top: 4px; }
.badge { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary);
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 999px; }
.badge-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

.toggle-row { display: flex; gap: 8px; align-items: center; }
.toggle-btn {
    font-family: var(--font-heading); font-weight: 600; font-size: 13px;
    color: var(--text-secondary); background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 999px; cursor: pointer;
    transition: all .15s ease;
}
.toggle-btn.active { color: #fff; background: linear-gradient(135deg, rgba(41,182,246,0.35), rgba(179,136,255,0.35)); border-color: var(--border-highlight); }
.toggle-btn:hover { color: #fff; }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
@media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px 18px; }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.kpi-val { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
.val-bull { color: var(--color-bull); }
.val-bear { color: var(--color-bear); }
.val-accent { color: var(--color-accent); }
.val-gold { color: var(--color-gold); }

.section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display:flex; align-items:center; gap:8px; }
.section-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 6px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; color: var(--text-secondary); font-weight: 600; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .3px; padding: 8px 10px; border-bottom: 1px solid var(--border-color); position: sticky; top:0; background: rgba(13,17,23,0.9); }
tbody td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); font-family: var(--font-mono); }
tbody tr:hover { background: rgba(255,255,255,0.03); }
.table-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }
.type-long { color: var(--color-bull); font-weight: 700; }
.type-short { color: var(--color-bear); font-weight: 700; }
.sym-pill { font-family: var(--font-mono); font-size: 11.5px; background: rgba(41,182,246,0.12); color: var(--color-accent);
    padding: 2px 8px; border-radius: 6px; }

.pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); }
.pagination button { font-family: var(--font-heading); background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
    color: var(--text-primary); padding: 6px 14px; border-radius: 8px; cursor: pointer; }
.pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
.search-box { font-family: var(--font-mono); background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
    color: var(--text-primary); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; }

.footer-note { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
.loading { text-align: center; padding: 60px; color: var(--text-secondary); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="container" id="app">
    <div class="loading" id="loading-msg">載入回測資料中...</div>
</div>

<template id="app-template">
<div class="card header-bar">
    <div>
        <div class="header-title">📉 Bollinger Band 均值回歸 — 美股 CFD 監控儀表板</div>
        <div class="header-sub" id="header-sub"></div>
        <div class="badge-row" id="badge-row"></div>
    </div>
    <div class="toggle-row">
        <button class="toggle-btn" data-split="train">TRAIN（樣本內）</button>
        <button class="toggle-btn active" data-split="test">TEST（樣本外，實際代表性較高）</button>
    </div>
</div>

<div class="kpi-grid" id="kpi-grid"></div>

<div class="card">
    <div class="section-title">資金曲線（等權重滿倉，1/N 分配）<span class="section-sub">紅色虛線＝train/test 分割點，test 曲線已銜接至 train 末端等比重繪</span></div>
    <div id="equity-chart" style="height:380px;"></div>
</div>

<div class="card">
    <div class="section-title">逐標的績效（10 檔 EA 實盤清單）<span class="section-sub">依 TEST 期 t-stat 排序</span></div>
    <div class="table-scroll">
    <table>
        <thead><tr>
            <th>標的</th><th>平均過夜晚數</th>
            <th>TRAIN 年化%</th><th>TRAIN 回撤%</th><th>TRAIN Sharpe</th>
            <th>TEST 年化%</th><th>TEST 回撤%</th><th>TEST Sharpe</th><th>TEST 勝率%</th><th>TEST t-stat</th>
        </tr></thead>
        <tbody id="symbol-table-body"></tbody>
    </table>
    </div>
</div>

<div class="card">
    <div class="section-title">交易明細（TEST 期，樣本外）<span class="section-sub" id="trades-count-label"></span></div>
    <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
        <input type="text" class="search-box" id="symbol-filter" placeholder="輸入代碼篩選，例如 AVGO">
        <select class="search-box" id="type-filter">
            <option value="">全部方向</option>
            <option value="LONG">LONG</option>
            <option value="SHORT">SHORT</option>
        </select>
    </div>
    <div class="table-scroll">
    <table>
        <thead><tr><th>標的</th><th>方向</th><th>進場時間</th><th>出場時間</th><th>過夜晚數</th><th>損益%</th></tr></thead>
        <tbody id="trades-table-body"></tbody>
    </table>
    </div>
    <div class="pagination">
        <span id="page-info"></span>
        <div>
            <button id="prev-page">← 上一頁</button>
            <button id="next-page">下一頁 →</button>
        </div>
    </div>
</div>

<div class="card footer-note">
    ⚠️ 以上為歷史回測結果（含真實 spread、進出場各一次 0.002% 手續費、真實隔夜倉息 swap、1%/筆風險部位、3% 每日虧損熔斷），不代表未來績效保證。
    TRAIN 為樣本內優化期間，TEST 為樣本外驗證期間，實盤表現應以 TEST 期數字為主要參考。策略邏輯與 EA 原始碼詳見對應 GitHub repository。
    <br>資料產生時間：<span id="generated-at"></span>
</div>
</template>

<script>
const fmtPct = (v, digits=2) => (v === null || v === undefined || isNaN(v)) ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(digits)}%`;
const fmtNum = (v, digits=2) => (v === null || v === undefined || isNaN(v)) ? '—' : v.toFixed(digits);
const cls = (v) => v >= 0 ? 'val-bull' : 'val-bear';

let DATA = null;
let currentSplit = 'test';
let tradesPage = 0;
const PAGE_SIZE = 40;

async function boot() {
    try {
        const res = await fetch('strategy_data.json?t=' + Date.now());
        DATA = await res.json();
    } catch (e) {
        document.getElementById('loading-msg').textContent = '資料載入失敗：' + e;
        return;
    }
    const tpl = document.getElementById('app-template');
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(tpl.content.cloneNode(true));

    document.getElementById('header-sub').textContent =
        `${DATA.timeframe} · ${DATA.universe.length} 檔標的 · ${DATA.cost_model}`;
    document.getElementById('generated-at').textContent = DATA.generated_at;

    const badgeRow = document.getElementById('badge-row');
    DATA.universe.forEach(s => {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = s;
        badgeRow.appendChild(b);
    });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSplit = btn.dataset.split;
            renderKpis();
        });
    });

    document.getElementById('symbol-filter').addEventListener('input', () => { tradesPage = 0; renderTrades(); });
    document.getElementById('type-filter').addEventListener('change', () => { tradesPage = 0; renderTrades(); });
    document.getElementById('prev-page').addEventListener('click', () => { if (tradesPage > 0) { tradesPage--; renderTrades(); } });
    document.getElementById('next-page').addEventListener('click', () => { tradesPage++; renderTrades(); });

    renderKpis();
    renderEquityChart();
    renderSymbolTable();
    renderTrades();
}

function renderKpis() {
    const m = DATA.portfolio_metrics[currentSplit];
    const grid = document.getElementById('kpi-grid');
    const cards = [
        { label: '總報酬 (Total Return)', val: fmtPct(m.total_return_pct), c: cls(m.total_return_pct) },
        { label: '年化報酬 (Ann. Return)', val: fmtPct(m.ann_return_pct), c: cls(m.ann_return_pct) },
        { label: '最大回撤 (Max Drawdown)', val: fmtPct(m.max_drawdown_pct), c: 'val-bear' },
        { label: '年化 Sharpe', val: fmtNum(m.ann_sharpe), c: 'val-accent' },
        { label: '勝率 (Win Rate)', val: fmtPct(m.win_rate_pct, 1), c: 'val-gold' },
        { label: '交易筆數 / 天期', val: `${m.n_trades} / ${Math.round(m.period_days)}d`, c: '' },
    ];
    grid.innerHTML = cards.map(c => `
        <div class="kpi-card">
            <div class="kpi-label">${c.label}</div>
            <div class="kpi-val ${c.c}">${c.val}</div>
        </div>`).join('');
}

function renderEquityChart() {
    const train = DATA.equity_curve.train;
    const test = DATA.equity_curve.test;
    const lastTrain = train[train.length - 1].equity;
    const testRebased = test.map(p => ({ date: p.date, equity: p.equity / test[0].equity * lastTrain }));

    const traceTrain = {
        x: train.map(p => p.date), y: train.map(p => p.equity),
        type: 'scatter', mode: 'lines', name: 'TRAIN', line: { color: '#8b949e', width: 1.5 }
    };
    const traceTest = {
        x: testRebased.map(p => p.date), y: testRebased.map(p => p.equity),
        type: 'scatter', mode: 'lines', name: 'TEST（樣本外）', line: { color: '#29b6f6', width: 2 }
    };
    const layout = {
        paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#8b949e', family: 'JetBrains Mono' },
        margin: { l: 50, r: 20, t: 10, b: 40 },
        xaxis: { gridcolor: 'rgba(255,255,255,0.06)' },
        yaxis: { gridcolor: 'rgba(255,255,255,0.06)', title: 'Portfolio Equity (x)' },
        shapes: [{ type: 'line', x0: train[train.length-1].date, x1: train[train.length-1].date,
                   y0: 0, y1: 1, yref: 'paper', line: { color: '#ff1744', width: 1, dash: 'dash' } }],
        legend: { orientation: 'h', y: 1.12 },
    };
    Plotly.newPlot('equity-chart', [traceTrain, traceTest], layout, { responsive: true, displayModeBar: false });
}

function renderSymbolTable() {
    const rows = [...DATA.symbols_meta].sort((a, b) => (b.test?.t_stat ?? -99) - (a.test?.t_stat ?? -99));
    const body = document.getElementById('symbol-table-body');
    body.innerHTML = rows.map(r => `
        <tr>
            <td><span class="sym-pill">${r.symbol}</span></td>
            <td>${fmtNum(r.avg_nights_held, 2)}</td>
            <td class="${cls(r.train?.ann_return_pct)}">${fmtPct(r.train?.ann_return_pct)}</td>
            <td class="val-bear">${fmtPct(r.train?.max_drawdown_pct)}</td>
            <td>${fmtNum(r.train?.ann_sharpe)}</td>
            <td class="${cls(r.test?.ann_return_pct)}">${fmtPct(r.test?.ann_return_pct)}</td>
            <td class="val-bear">${fmtPct(r.test?.max_drawdown_pct)}</td>
            <td>${fmtNum(r.test?.ann_sharpe)}</td>
            <td>${fmtNum(r.test?.win_rate_pct, 1)}</td>
            <td>${fmtNum(r.test?.t_stat)}</td>
        </tr>`).join('');
}

function getFilteredTrades() {
    const symQuery = document.getElementById('symbol-filter').value.trim().toUpperCase();
    const typeQuery = document.getElementById('type-filter').value;
    return DATA.all_trades_test.filter(t => {
        if (symQuery && !t.symbol.toUpperCase().includes(symQuery)) return false;
        if (typeQuery && t.type !== typeQuery) return false;
        return true;
    });
}

function renderTrades() {
    const filtered = getFilteredTrades();
    document.getElementById('trades-count-label').textContent = `共 ${filtered.length} 筆（總計 ${DATA.all_trades_test.length} 筆）`;
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    tradesPage = Math.min(tradesPage, totalPages - 1);
    const start = tradesPage * PAGE_SIZE;
    const pageRows = filtered.slice(start, start + PAGE_SIZE);

    const body = document.getElementById('trades-table-body');
    body.innerHTML = pageRows.map(t => `
        <tr>
            <td><span class="sym-pill">${t.symbol}</span></td>
            <td class="${t.type === 'LONG' ? 'type-long' : 'type-short'}">${t.type}</td>
            <td>${t.entry_t}</td>
            <td>${t.exit_t}</td>
            <td>${t.nights}</td>
            <td class="${cls(t.pnl_pct)}">${fmtPct(t.pnl_pct, 3)}</td>
        </tr>`).join('');

    document.getElementById('page-info').textContent = `第 ${tradesPage + 1} / ${totalPages} 頁`;
    document.getElementById('prev-page').disabled = tradesPage === 0;
    document.getElementById('next-page').disabled = tradesPage >= totalPages - 1;
}

boot();
</script>
</body>
</html>
